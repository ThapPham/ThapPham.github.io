<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phạm Đình Thập — CV</title>
<meta name="description" content="CV Phạm Đình Thập — Kỹ sư Cơ khí, Quản lý Sản xuất. Song ngữ Việt / Anh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#ffffff;
  --ground:#dfe3e6;
  --side:#eceff1;
  --ink:#22262b;
  --body:#3b4147;
  --muted:#6b747c;
  --rule:#d5dade;
  --accent:#b7472f;
  --accent-soft:#e6d3cd;
  --sheet:1040px;
  --f-sans:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--body);
  font-family:var(--f-sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding:24px 16px 64px;
}
img{max-width:100%;display:block}

/* ---------- language switch ---------- */
.topbar{
  max-width:var(--sheet);margin:0 auto 18px;
  display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;
}
.switch{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;box-shadow:0 1px 2px rgba(34,38,43,.06)}
.switch button{
  font:600 12px/1 var(--f-sans);letter-spacing:.08em;text-transform:uppercase;
  padding:8px 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;
  transition:background .18s ease,color .18s ease;
}
.switch button:hover{color:var(--ink)}
.switch button[aria-pressed="true"]{background:var(--ink);color:#fff}
.switch button:focus-visible,.print-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.print-btn{
  font:500 12px/1 var(--f-sans);letter-spacing:.06em;text-transform:uppercase;
  padding:10px 16px;border:1px solid var(--rule);border-radius:999px;
  background:var(--paper);color:var(--muted);cursor:pointer;transition:color .18s ease,border-color .18s ease;
}
.print-btn:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- sheet ---------- */
.sheet{
  max-width:var(--sheet);margin:0 auto;background:var(--paper);
  box-shadow:0 1px 3px rgba(34,38,43,.1),0 12px 40px rgba(34,38,43,.12);
  display:grid;grid-template-columns:325px 1fr;
}

/* ---------- sidebar ---------- */
.aside{background:var(--side);padding:0 0 36px;display:flex;flex-direction:column;gap:28px}
.photo-frame{background:#fff;padding:14px}
.photo-frame img{aspect-ratio:3/4;object-fit:cover;object-position:50% 12%;width:100%;background:#f2f4f5}
.aside section{padding:0 28px}
.aside h2,.main h2{
  font:600 12px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  margin:0 0 16px;display:flex;align-items:center;gap:10px;
}
.aside h2::after,.main h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.main h2::after{background:var(--accent-soft)}

.skill{display:grid;gap:6px;margin-bottom:14px}
.skill-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.skill-name{font-size:13.5px;font-weight:500;color:var(--ink)}
.skill-note{font:500 11px/1 var(--f-mono);color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.bar{height:5px;background:#d7dbde;border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}

ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ul.plain li{position:relative;padding-left:15px;font-size:13.5px;line-height:1.5}
ul.plain li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}

.contact{display:grid;gap:12px}
.contact .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.contact .k{
  font:500 10px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding-top:3px;min-width:52px;
}
.contact .v{font-size:13.5px;line-height:1.45;color:var(--ink);word-break:break-word}
.contact a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.contact a:hover{border-bottom-color:var(--accent)}

/* ---------- main ---------- */
.main{padding:0 0 44px}
.nameplate{
  background:var(--ink);color:#fff;padding:34px 40px 30px;margin-bottom:34px;
  display:flex;align-items:center;gap:22px;
}
.np-photo{display:none;width:88px;height:110px;object-fit:cover;object-position:50% 12%;background:#fff;flex:none}
.np-text{min-width:0}
.nameplate h1{
  margin:0;font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:.035em;
  text-transform:uppercase;line-height:1.12;text-wrap:balance;
}
.nameplate .role{
  margin:12px 0 0;font-size:14px;font-weight:500;color:#c7cdd2;letter-spacing:.02em;
}
.nameplate .meta{
  margin:16px 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);
  font:400 11.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9aa3ab;
  display:flex;gap:18px;flex-wrap:wrap;
}
.main section{padding:0 40px;margin-bottom:32px}
.main section:last-child{margin-bottom:0}
.lede p{margin:0 0 10px;font-size:14.5px;line-height:1.72;max-width:64ch}
.lede p:last-child{margin-bottom:0}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--accent-soft)}
.job{position:relative;margin-bottom:26px;break-inside:avoid}
.job:last-child{margin-bottom:0}
.job::before{
  content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--accent);
}
.job.current::before{background:var(--accent)}
.job-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:3px}
.job h3{margin:0;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.005em}
.job .period{
  font:500 11.5px/1 var(--f-mono);color:var(--accent);letter-spacing:.04em;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.job .org{margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:500}
.job ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.job li{position:relative;padding-left:16px;font-size:14px;line-height:1.6}
.job li::before{
  content:"";position:absolute;left:0;top:.66em;width:6px;height:1.5px;background:var(--muted);
}

.edu{display:grid;gap:4px;break-inside:avoid}
.edu-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.edu h3{margin:0;font-size:16px;font-weight:600;color:var(--ink)}
.edu .period{font:500 11.5px/1 var(--f-mono);color:var(--accent);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.edu .degree{margin:0;font-size:14px;color:var(--body)}
.edu .note{margin:0;font-size:13.5px;color:var(--muted)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.main ul.plain li{font-size:14px}

.foot{
  max-width:var(--sheet);margin:20px auto 0;text-align:center;
  font:400 11.5px/1.6 var(--f-mono);color:#8a9299;letter-spacing:.04em;
}

/* ---------- responsive ---------- */
@media (max-width:880px){
  .sheet{display:flex;flex-direction:column}
  .main{order:1;padding-bottom:34px}
  .aside{order:2;padding:30px 0;gap:26px}
  .photo-frame{display:none}
  .np-photo{display:block}
  .nameplate{padding:24px;margin-bottom:28px;gap:18px}
  .nameplate h1{font-size:clamp(22px,6.4vw,30px)}
  .nameplate .meta{gap:12px;font-size:10.5px}
  .main section{padding:0 24px}
  .aside section{padding:0 24px}
  .grid-2{grid-template-columns:1fr}
}
@media (max-width:420px){
  body{padding:16px 12px 40px}
  .np-photo{width:68px;height:86px}
  .topbar{justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0;font-size:10.5pt}
  .topbar,.foot{display:none}
  .sheet{box-shadow:none;max-width:100%;grid-template-columns:300px 1fr}
  .aside,.nameplate,.bar span,.bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .job,.edu,.skill{break-inside:avoid}
  .main section{margin-bottom:18px}
}
</style>
</head>

/* ===================== rendering ===================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function render(lang) {
  const d = DATA[lang];
  document.documentElement.lang = d.htmlLang;
  document.title = d.docTitle;

  $("name").textContent = d.name;
  $("role").textContent = d.role;
  $("meta").innerHTML = d.meta.map(m => `<span>${esc(m)}</span>`).join("");
  $("photo").alt = d.name;

  for (const [key, id] of Object.entries({
    skills:"h-skills", soft:"h-soft", lang:"h-lang", hobby:"h-hobby",
    contact:"h-contact", profile:"h-profile", exp:"h-exp", edu:"h-edu", act:"h-act"
  })) $(id).textContent = d.headings[key];

  $("printBtn").textContent = d.ui.print;
  $("foot").textContent = d.ui.foot;

  $("profile").innerHTML = d.profile.map(p => `<p>${esc(p)}</p>`).join("");

  $("skills").innerHTML = d.skills.map(s => `
    <div class="skill">
      <div class="skill-top">
        <span class="skill-name">${esc(s.name)}</span>
        <span class="skill-note">${esc(s.note)}</span>
      </div>
      <div class="bar"><span style="width:${Number(s.level)}%"></span></div>
    </div>`).join("");

  const list = (arr) => arr.map(i => `<li>${esc(i)}</li>`).join("");
  $("soft").innerHTML = list(d.soft);
  $("langs").innerHTML = list(d.languages);
  $("hobbies").innerHTML = list(d.hobbies);
  $("activities").innerHTML = list(d.activities);

  $("contact").innerHTML = d.contact.map(c => `
    <div class="row">
      <span class="k">${esc(c.k)}</span>
      <span class="v">${c.href ? `<a href="${esc(c.href)}">${esc(c.v)}</a>` : esc(c.v)}</span>
    </div>`).join("");

  $("experience").innerHTML = d.experience.map(j => `
    <article class="job${j.current ? " current" : ""}">
      <div class="job-head">
        <h3>${esc(j.role)}</h3>
        <span class="period">${esc(j.period)}</span>
      </div>
      <p class="org">${esc(j.org)}</p>
      <ul>${j.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
    </article>`).join("");

  $("education").innerHTML = d.education.map(e => `
    <div class="edu">
      <div class="edu-head">
        <h3>${esc(e.school)}</h3>
        <span class="period">${esc(e.period)}</span>
      </div>
      <p class="degree">${esc(e.degree)}</p>
      ${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}
    </div>`).join("");

  $("btn-vi").setAttribute("aria-pressed", String(lang === "vi"));
  $("btn-en").setAttribute("aria-pressed", String(lang === "en"));
}

function pickInitialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "vi" || q === "en") return q;
  try {
    const saved = localStorage.getItem("cv-lang");
    if (saved === "vi" || saved === "en") return saved;
  } catch (e) { /* storage unavailable */ }
  return (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "vi";
}

function setLang(lang, push) {
  render(lang);
  try { localStorage.setItem("cv-lang", lang); } catch (e) { /* ignore */ }
  if (push) {
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
  }
}

document.querySelectorAll("#langSwitch button").forEach(b => {
  b.addEventListener("click", () => setLang(b.dataset.lang, true));
});
$("printBtn").addEventListener("click", () => window.print());

setLang(pickInitialLang(), false);
</script>
